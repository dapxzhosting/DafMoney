name: Build DafMoney APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ -f "android/app/google-services.json" ]; then
            echo "Memakai google-services.json lokal"
          else
            echo "Membuat mock google-services.json untuk CI build"
            echo '{"project_info":{"project_number":"502701571624","project_id":"dafmoney","storage_bucket":"dafmoney.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:502701571624:android:e0bb10fbdaa7d754f8ff1d","android_client_info":{"package_name":"com.example.keuangan"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDummyKeyForCIBuild1234567890"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Siapkan keystore rilis (dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::$secret_name wajib tersedia untuk membangun release"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          test -s android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build Release APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Build gagal pada percobaan $attempt, mengulang setelah jeda"
            sleep $((attempt * 60))
          done
          exit 1

      - name: Verifikasi tanda tangan release
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DafMoney-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
