name: daf_money
description: "DafMoney - Aplikasi Catatan Keuangan Pribadi Modern"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  shared_preferences: ^2.3.5
  intl: any
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  equatable: ^2.0.7

  # Fitur Spesifik Android (Quick Actions, Notifications, Home Widget)
  quick_actions: ^1.0.8
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0
  timezone: ^0.9.4
  dynamic_color: ^1.7.5
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0

  # Ekspor & bagikan laporan (PDF / gambar)
  pdf: ^3.11.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Impor CSV (memilih berkas)
  file_picker: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E9F6E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23